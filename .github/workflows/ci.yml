name : Onboard registration

on:
push:
branches:
- main

job:
backend:
runs-on: ubuntu-latest

steps:
- name: check
uses: actions/checkout@v4

- name: setup node.js
uses : actions/setup-node@v4
with:
 node-version: 22

- name : install dependencies
  working-directory : backend
  run : npm ci

- name : check backend
  working-directory: backend
  run : node --check server.js
